minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - kirbyuse@2.0.0-beta.7
  - '@kirby-tools/licensing@1.1.0'
  - kirby-types@2.0.0-beta.8

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

shellEmulator: true
packages:
  - src/assets

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
