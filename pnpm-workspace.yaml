minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - kirby-types@2.0.0
  - kirbyup@4.0.0
  - kirbyuse@2.0.0
  - '@kirby-tools/licensing@1.1.0'

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

shellEmulator: true
packages:
  - src/assets

overrides:
  "@babel/runtime": ^7.26.10

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
